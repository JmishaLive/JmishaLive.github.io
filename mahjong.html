<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merge Mahjong - Точная сетка координат</title>
    <style>
        :root {
            --tile-width: 60px;
            --tile-height: 80px;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2b5c4f; 
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 10px;
            overflow: hidden; 
        }

        .header { 
            display: flex; 
            flex-wrap: wrap; 
            justify-content: center;
            gap: 10px; 
            margin-bottom: 10px; 
            align-items: center; 
            background: rgba(0,0,0,0.25);
            padding: 8px 16px;
            border-radius: 12px;
        }

        .input-group {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: bold;
            font-size: 14px;
        }

        select, input[type="number"], button {
            padding: 8px 12px; font-size: 15px; font-weight: bold;
            cursor: pointer; border: none; border-radius: 8px;
            color: #333; outline: none;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        
        select, input[type="number"] { 
            background-color: #ecf0f1; 
            box-shadow: 0 3px 0 #bdc3c7; 
        }
        input[type="number"] { width: 65px; cursor: text; }

        button { 
            background-color: #f1c40f; 
            box-shadow: 0 4px 0 #d4ac0d; 
        }
        button:active { transform: translateY(3px); box-shadow: 0 0 0 #d4ac0d; }

        #shuffle-btn.destroy-mode {
            background-color: #e74c3c;
            color: white;
            box-shadow: 0 4px 0 #c0392b;
        }

        #game-board {
            position: relative; 
            width: 920px; 
            height: 660px;
            background-color: rgba(0, 0, 0, 0.2); 
            border-radius: 12px;
            margin-bottom: 10px; 
            overflow: hidden;
        }

        #tiles-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            transform-origin: center center;
            transition: transform 0.25s ease-out;
        }

        .tile {
            position: absolute; width: var(--tile-width); height: var(--tile-height);
            border: 1px solid rgba(255,255,255,0.2); border-radius: 8px;
            display: flex; justify-content: center; align-items: center;
            font-size: 28px; font-weight: bold; color: white;
            cursor: grab; user-select: none; touch-action: none; 
            filter: brightness(1);
            box-shadow: 2px 2px 0px rgba(255,255,255,0.3), 4px 4px 0px rgba(0,0,0,0.2), 6px 6px 10px rgba(0,0,0,0.5);
            transition: filter 0.3s, border 0.2s, transform 0.2s;
            background-size: cover; background-position: center;
        }

        .tile.blocked { filter: brightness(0.35) grayscale(0.6); cursor: not-allowed; }
        .tile.dragging {
            cursor: grabbing; z-index: 99999 !important; 
            filter: brightness(1.2); transform: scale(1.15) translateY(-5px);
            border: 3px solid #fff; box-shadow: 4px 4px 0px rgba(255,255,255,0.4), 10px 10px 25px rgba(0, 0, 0, 0.7);
        }
        .tile.snap-back { 
            transition: left 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), 
                        top 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), 
                        transform 0.3s !important; 
        }

        @keyframes popIn { 0% { transform: scale(0.3); opacity: 0; } 60% { transform: scale(1.15); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
        @keyframes burnOut { 0% { transform: scale(1); opacity: 1; filter: brightness(1.2); } 100% { transform: scale(1.4); opacity: 0; filter: brightness(2); } }
        @keyframes shufflePulse { 0% { transform: scale(1); } 50% { transform: scale(0.7) rotate(10deg); filter: brightness(1.5); } 100% { transform: scale(1); } }

        .tile.pop-in { animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .tile.burn { pointer-events: none !important; z-index: 99999 !important; animation: burnOut 0.3s ease-out forwards; }
        .tile.shuffling { animation: shufflePulse 0.4s ease-in-out; }

        .overlay-screen {
            display: none; position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; background: rgba(0,0,0,0.85);
            justify-content: center; align-items: center; flex-direction: column;
            z-index: 5000; border-radius: 12px;
        }
        .overlay-screen h1 { font-size: 44px; margin-bottom: 20px; text-align: center; }
        .overlay-screen .buttons { display: flex; gap: 15px; }

        #victory-screen h1 { color: #f1c40f; }
        #defeat-screen h1 { color: #e74c3c; }

        .floating-text {
            position: fixed; pointer-events: none; color: #fff;
            font-size: 22px; font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            z-index: 100000; animation: floatUp 1.2s ease-out forwards;
        }
        @keyframes floatUp { 0% { opacity: 1; transform: translate(-50%, 0) scale(1); } 100% { opacity: 0; transform: translate(-50%, -50px) scale(1.2); } }
    </style>
</head>
<body>

    <div class="header">
        <select id="theme-select"></select>

        <div class="input-group">
            <label for="tile-count-input">Фишек:</label>
            <input type="number" id="tile-count-input" value="64" min="20" max="110" step="2">
        </div>

        <div class="input-group">
            <label for="layers-select">Слоев:</label>
            <select id="layers-select">
                <option value="2">2 слоя</option>
                <option value="3" selected>3 слоя</option>
                <option value="4">4 слоя</option>
                <option value="5">5 слоев</option>
            </select>
        </div>

        <select id="archetype-select">
            <option value="random">Форма: Случайная</option>
            <option value="diamond">Форма: Ромб/Кристалл</option>
            <option value="pagoda" selected>Форма: Пагода</option>
            <option value="cross">Форма: Решетка (#)</option>
            <option value="horns">Форма: Рога/Крылья</option>
            <option value="fortress">Форма: Крепость</option>
        </select>

        <select id="difficulty-select">
            <option value="1">1 масть</option>
            <option value="2">2 масти</option>
            <option value="3" selected>3 масти</option>
        </select>

        <button id="start-btn">Старт</button>
        <button id="undo-btn">Отмена</button>
    </div>

    <div id="game-board">
        <div id="tiles-container"></div>

        <div id="victory-screen" class="overlay-screen">
            <h1>ПОБЕДА!</h1>
            <div class="buttons">
                <button id="restart-win-btn">Играть снова</button>
            </div>
        </div>

        <div id="defeat-screen" class="overlay-screen">
            <h1>Нет доступных ходов</h1>
            <div class="buttons">
                <button id="restart-lose-btn">Заново</button>
                <button id="shuffle-btn">Перемешать</button>
            </div>
        </div>
    </div>

    <script>
        const THEMES_CONFIG = [
            { id: 'colors', name: 'Цвета', type: 'color' },
            { id: 'theme_01', name: 'Картинки 1', type: 'image', path: 'mahjong/theme_01' },
            { id: 'theme_02', name: 'Картинки 2', type: 'image', path: 'mahjong/theme_02' }
        ];

        const boardElement = document.getElementById('game-board');
        const tilesContainer = document.getElementById('tiles-container');
        const startBtn = document.getElementById('start-btn');
        const undoBtn = document.getElementById('undo-btn');
        const tileCountInput = document.getElementById('tile-count-input');
        const layersSelect = document.getElementById('layers-select');
        const archetypeSelect = document.getElementById('archetype-select');
        const difficultySelect = document.getElementById('difficulty-select');
        const themeSelect = document.getElementById('theme-select');
        
        const victoryScreen = document.getElementById('victory-screen');
        const defeatScreen = document.getElementById('defeat-screen');
        const restartWinBtn = document.getElementById('restart-win-btn');
        const restartLoseBtn = document.getElementById('restart-lose-btn');
        const shuffleBtn = document.getElementById('shuffle-btn');

        const TILE_WIDTH = 60;
        const TILE_HEIGHT = 80;

        let tiles = []; 
        let history = []; 
        let idCounter = 0; 
        
        let currentScale = 1.0;
        let currentShiftX = 0;
        let currentShiftY = 0;

        const SUIT_COLORS = { blue: '#2980b9', green: '#27ae60', yellow: '#d35400' };

        THEMES_CONFIG.forEach(theme => {
            const option = document.createElement('option');
            option.value = theme.id;
            option.innerText = theme.name;
            themeSelect.appendChild(option);
        });

        class Tile {
            constructor(id, x, y, z, value, suit) {
                this.id = id; this.x = x; this.y = y; this.z = z;
                this.value = value; this.suit = suit; 
                
                this.element = document.createElement('div');
                this.element.className = 'tile';
                this.element.innerText = this.value;
                
                this.applyTheme();
                
                const normX = Math.round(this.x + 10); 
                const normY = Math.round(this.y + 10);
                this.element.style.zIndex = Math.floor((this.z * 1000) + (normY * 100) + normX);
                
                const zShift = this.z * 6; 
                this.pxLeft = (this.x * TILE_WIDTH) - zShift + currentShiftX;
                this.pxTop = (this.y * TILE_HEIGHT) - zShift + currentShiftY;
                
                this.element.style.left = `${this.pxLeft}px`;
                this.element.style.top = `${this.pxTop}px`;
                this.element.tileInstance = this;

                this.isDragging = false;
                this.element.addEventListener('pointerdown', (e) => this.startDrag(e));
                this.element.addEventListener('pointermove', (e) => this.drag(e));
                this.element.addEventListener('pointerup', (e) => this.stopDrag(e));
                this.element.addEventListener('pointercancel', (e) => this.snapBackAndCancel(e));
            }

            applyTheme() {
                const currentThemeId = themeSelect.value;
                const themeData = THEMES_CONFIG.find(t => t.id === currentThemeId);
                
                if (themeData && themeData.type === 'image') {
                    this.element.style.backgroundImage = `url('${themeData.path}/${this.suit}_${this.value}.png')`;
                    this.element.style.color = 'transparent'; 
                    this.element.style.backgroundColor = 'transparent';
                } else {
                    this.element.style.backgroundImage = 'none';
                    this.element.style.backgroundColor = SUIT_COLORS[this.suit];
                    this.element.style.color = 'white'; 
                }
            }

            startDrag(e) {
                if (!isTileFree(this)) {
                    showFloatingText("Заблокировано", e.clientX, e.clientY);
                    return;
                }
                e.preventDefault();
                this.isDragging = true;
                this.element.setPointerCapture(e.pointerId);
                this.element.classList.add('dragging');

                const rect = this.element.getBoundingClientRect();
                this.dragOffsetX = (e.clientX - rect.left) / currentScale;
                this.dragOffsetY = (e.clientY - rect.top) / currentScale;
            }

            drag(e) {
                if (!this.isDragging) return;
                const containerRect = tilesContainer.getBoundingClientRect();
                const newLeft = ((e.clientX - containerRect.left) / currentScale) - this.dragOffsetX;
                const newTop = ((e.clientY - containerRect.top) / currentScale) - this.dragOffsetY;

                this.element.style.left = `${newLeft}px`;
                this.element.style.top = `${newTop}px`;
            }

            stopDrag(e) {
                if (!this.isDragging) return;
                this.isDragging = false;
                this.element.releasePointerCapture(e.pointerId);
                this.element.classList.remove('dragging');
                
                this.element.style.pointerEvents = 'none';
                const elemBelow = document.elementFromPoint(e.clientX, e.clientY);
                this.element.style.pointerEvents = 'auto'; 

                let targetTile = null;
                if (elemBelow && elemBelow.classList.contains('tile')) {
                    targetTile = elemBelow.tileInstance;
                }

                if (targetTile && targetTile !== this && isTileFree(targetTile)) {
                    if (targetTile.value === this.value && targetTile.suit === this.suit) {
                        mergeTiles(this, targetTile, e);
                        return; 
                    } else {
                        showFloatingText("Не подходит", e.clientX, e.clientY, "#fff");
                    }
                }
                this.snapBack();
            }

            snapBackAndCancel(e) {
                if (!this.isDragging) return;
                this.isDragging = false;
                this.element.releasePointerCapture(e.pointerId);
                this.element.classList.remove('dragging');
                this.snapBack();
            }

            snapBack() {
                this.element.classList.add('snap-back');
                this.element.style.left = `${this.pxLeft}px`;
                this.element.style.top = `${this.pxTop}px`;
                setTimeout(() => this.element.classList.remove('snap-back'), 300);
            }
        }

        function showFloatingText(message, x, y, color = "#e74c3c") {
            const textEl = document.createElement('div');
            textEl.className = 'floating-text';
            textEl.innerText = message;
            textEl.style.left = `${x}px`; textEl.style.top = `${y}px`; textEl.style.color = color;
            document.body.appendChild(textEl);
            setTimeout(() => textEl.remove(), 1200);
        }

        // --- ТОЧНЫЙ РАСЧЕТ ДОСТУПНОСТИ ПО СЕТКЕ (БЕЗ ВЛИЯНИЯ СДВИГА И ЗУМА) ---
        function isTileFree(targetTile) {
            // 1. ПРОВЕРКА СВЕРХУ:
            // Фишка заблокирована, если на ЛЮБОМ верхнем этаже над ней есть другая фишка
            const isCovered = tiles.some(t => 
                t.z > targetTile.z && 
                Math.abs(t.x - targetTile.x) < 0.6 && 
                Math.abs(t.y - targetTile.y) < 0.6
            );
            if (isCovered) return false;

            // 2. ПРОВЕРКА ПО БОКАМ:
            // Фишка свободна, если ХОТЯ БЫ ОДИН бок (левый или правый) не зажат стеной того же этажа или выше
            const hasLeftNeighbor = tiles.some(t => 
                t.id !== targetTile.id &&
                t.z >= targetTile.z &&
                Math.abs(t.y - targetTile.y) < 0.6 &&
                Math.abs(t.x - (targetTile.x - 1)) < 0.6
            );

            const hasRightNeighbor = tiles.some(t => 
                t.id !== targetTile.id &&
                t.z >= targetTile.z &&
                Math.abs(t.y - targetTile.y) < 0.6 &&
                Math.abs(t.x - (targetTile.x + 1)) < 0.6
            );

            return !(hasLeftNeighbor && hasRightNeighbor);
        }

        function updateBoardVisuals() {
            tiles.forEach(tile => {
                if (isTileFree(tile)) {
                    tile.element.classList.remove('blocked');
                } else {
                    tile.element.classList.add('blocked');
                }
            });
        }

        function saveState() {
            const state = tiles.map(t => ({ id: t.id, x: t.x, y: t.y, z: t.z, value: t.value, suit: t.suit }));
            history.push(state);
        }

        function hasAvailableMoves() {
            if (tiles.length === 0) return true; 
            const freeTiles = tiles.filter(t => isTileFree(t));
            for (let i = 0; i < freeTiles.length; i++) {
                for (let j = i + 1; j < freeTiles.length; j++) {
                    if (freeTiles[i].value === freeTiles[j].value && freeTiles[i].suit === freeTiles[j].suit) {
                        return true; 
                    }
                }
            }
            return false; 
        }

        function handleDefeat() {
            const freeTiles = tiles.filter(t => isTileFree(t));
            if (freeTiles.length >= 2) {
                shuffleBtn.innerText = "Перемешать";
                shuffleBtn.classList.remove('destroy-mode');
                shuffleBtn.onclick = shuffleBoard;
            } else {
                shuffleBtn.innerText = "Уничтожить столбец";
                shuffleBtn.classList.add('destroy-mode');
                shuffleBtn.onclick = destroyColumn;
            }
            defeatScreen.style.display = 'flex';
        }

        function mergeTiles(draggedTile, targetTile, event) {
            saveState(); 

            tiles = tiles.filter(t => t.id !== draggedTile.id && t.id !== targetTile.id);
            draggedTile.element.style.left = `${targetTile.pxLeft}px`;
            draggedTile.element.style.top = `${targetTile.pxTop}px`;
            
            draggedTile.element.classList.add('burn');
            targetTile.element.classList.add('burn');

            setTimeout(() => {
                draggedTile.element.remove();
                targetTile.element.remove();
            }, 300);

            if (draggedTile.value === 8) {
                showFloatingText("🔥 Сгорели!", event.clientX, event.clientY, "#f1c40f");
            } else {
                const newValue = draggedTile.value * 2; 
                const newTile = new Tile(idCounter++, targetTile.x, targetTile.y, targetTile.z, newValue, draggedTile.suit);
                
                newTile.element.classList.add('pop-in');
                setTimeout(() => newTile.element.classList.remove('pop-in'), 300);

                tiles.push(newTile);
                tilesContainer.appendChild(newTile.element);
            }
            
            updateBoardVisuals();
            
            if (tiles.length === 0) {
                victoryScreen.style.display = 'flex';
            } else if (!hasAvailableMoves()) {
                handleDefeat(); 
            }
        }

        function shuffleBoard() {
            saveState(); 

            const getExposure = (x, y, z) => (z * 100) + Math.abs(x) + Math.abs(y);
            
            let positionsInfo = tiles.map(t => ({
                tile: t,
                isFree: isTileFree(t),
                exposure: getExposure(t.x, t.y, t.z)
            }));

            positionsInfo.sort((a, b) => {
                if (a.isFree && !b.isFree) return -1; 
                if (!a.isFree && b.isFree) return 1;
                return b.exposure - a.exposure;       
            });

            let remainingData = tiles.map(t => ({ value: t.value, suit: t.suit }));
            remainingData.sort((a, b) => {
                if (a.value !== b.value) return a.value - b.value;
                if (a.suit < b.suit) return -1;
                if (a.suit > b.suit) return 1;
                return 0;
            });

            positionsInfo.forEach((info, index) => {
                const t = info.tile;
                t.value = remainingData[index].value;
                t.suit = remainingData[index].suit;
                
                t.element.innerText = t.value;
                t.applyTheme();

                t.element.classList.add('shuffling');
                setTimeout(() => t.element.classList.remove('shuffling'), 400);
            });

            defeatScreen.style.display = 'none'; 
            updateBoardVisuals(); 
        }

        function destroyColumn() {
            saveState(); 
            const freeTiles = tiles.filter(t => isTileFree(t));
            if (freeTiles.length === 0) return; 

            const target = freeTiles[0];
            const columnTiles = tiles.filter(t => Math.abs(t.x - target.x) < 0.5 && Math.abs(t.y - target.y) < 0.5);

            columnTiles.forEach(t => {
                t.element.classList.add('burn'); 
                setTimeout(() => t.element.remove(), 300);
            });

            tiles = tiles.filter(t => Math.abs(t.x - target.x) >= 0.5 || Math.abs(t.y - target.y) >= 0.5);
            defeatScreen.style.display = 'none';

            setTimeout(() => {
                updateBoardVisuals();
                if (tiles.length === 0) {
                    victoryScreen.style.display = 'flex'; 
                } else if (!hasAvailableMoves()) {
                    handleDefeat(); 
                }
            }, 300);
        }

        function undoMove() {
            if (history.length === 0) return; 
            
            const lastState = history.pop(); 
            
            tilesContainer.innerHTML = '';
            tiles = [];
            victoryScreen.style.display = 'none'; 
            defeatScreen.style.display = 'none'; 

            lastState.forEach(data => {
                const t = new Tile(data.id, data.x, data.y, data.z, data.value, data.suit);
                tiles.push(t);
                tilesContainer.appendChild(t.element);
            });

            const maxId = Math.max(...lastState.map(t => t.id), -1);
            idCounter = maxId + 1;
            
            updateBoardVisuals();
        }

        function generateTilePool(targetCount, suitsCount) {
            let suitAllocations = Array(suitsCount).fill(Math.floor(targetCount / suitsCount));
            for (let i = 0; i < targetCount % suitsCount; i++) suitAllocations[i]++;

            const suitNames = ['blue', 'green', 'yellow'];
            let fullPool = [];

            suitAllocations.forEach((count, suitIdx) => {
                const suit = suitNames[suitIdx];
                let pairsOfEight = Math.max(1, Math.min(Math.floor(count / 2), Math.round(count / 8)));
                let pool = Array(pairsOfEight * 2).fill(8);

                while (pool.length < count) {
                    let splittable = pool.map((v, i) => v > 1 ? i : -1).filter(i => i !== -1);
                    if (splittable.length === 0) break; 
                    
                    let randIdx = splittable[Math.floor(Math.random() * splittable.length)];
                    let val = pool[randIdx];
                    pool.splice(randIdx, 1);
                    pool.push(val / 2, val / 2);
                }

                pool.forEach(v => fullPool.push({ value: v, suit }));
            });

            return fullPool;
        }

        function generateProceduralLayout(targetCount, maxLayers, archetype) {
            const hasPos = (list, x, y, z) => list.some(p => p.x === x && p.y === y && p.z === z);

            let archetypes = ['diamond', 'pagoda', 'cross', 'horns', 'fortress'];
            let selectedArch = archetype === 'random' ? archetypes[Math.floor(Math.random() * archetypes.length)] : archetype;

            let positions = [];

            function addSymmetric(x, y, z) {
                if (hasPos(positions, x, y, z)) return;
                positions.push({ x, y, z });
                if (x !== 0 && !hasPos(positions, -x, y, z)) {
                    positions.push({ x: -x, y, z });
                }
            }

            if (selectedArch === 'diamond') { 
                const widths = [2, 4, 6, 8, 8, 6, 4, 2];
                widths.forEach((w, idx) => {
                    let y = idx - 3.5;
                    for (let x = 0.5; x < w / 2; x++) addSymmetric(x, y, 0);
                });
            } 
            else if (selectedArch === 'pagoda') { 
                for (let x = 0.5; x <= 3.5; x++) { addSymmetric(x, -3.5, 0); addSymmetric(x, 3.5, 0); }
                for (let y = -2.5; y <= 2.5; y++) {
                    addSymmetric(0.5, y, 0); addSymmetric(1.5, y, 0);
                }
                addSymmetric(2.5, -0.5, 0); addSymmetric(2.5, 0.5, 0);
                addSymmetric(3.5, -0.5, 0); addSymmetric(3.5, 0.5, 0);
            } 
            else if (selectedArch === 'cross') { 
                for (let x = 0.5; x <= 2.5; x++) { addSymmetric(x, -2.5, 0); addSymmetric(x, 2.5, 0); }
                for (let y = -2.5; y <= 2.5; y++) { addSymmetric(1.5, y, 0); }
                addSymmetric(2.5, -0.5, 0); addSymmetric(2.5, 0.5, 0);
                addSymmetric(3.5, -0.5, 0); addSymmetric(3.5, 0.5, 0);
            } 
            else if (selectedArch === 'horns') { 
                for (let y = -3.5; y <= -1.5; y++) addSymmetric(2.5, y, 0);
                for (let x = 0.5; x <= 3.5; x++) addSymmetric(x, -0.5, 0);
                for (let y = 0.5; y <= 2.5; y++) { addSymmetric(0.5, y, 0); addSymmetric(1.5, y, 0); }
                addSymmetric(0.5, 3.5, 0);
            } 
            else { 
                for (let x = 0.5; x <= 3.5; x++) {
                    for (let y = -2.5; y <= 2.5; y++) {
                        if (Math.abs(x) >= 2.5 || Math.abs(y) >= 1.5 || (Math.abs(x) <= 1.5 && Math.abs(y) <= 0.5)) {
                            addSymmetric(x, y, 0);
                        }
                    }
                }
            }

            for (let z = 1; z < maxLayers; z++) {
                let supportCandidates = positions.filter(p => p.z === z - 1 && p.x >= 0);
                supportCandidates.forEach(p => {
                    if (Math.abs(p.x) <= (4 - z) && Math.abs(p.y) <= (3.5 - z * 0.7)) {
                        if (Math.random() > 0.25) {
                            addSymmetric(p.x, p.y, z);
                        }
                    }
                });
            }

            let safety = 0;
            while (positions.length !== targetCount && safety < 1000) {
                safety++;
                if (positions.length > targetCount) {
                    let removable = positions.filter(p => 
                        !positions.some(other => other.x === p.x && other.y === p.y && other.z > p.z) && 
                        p.x >= 0
                    );
                    removable.sort((a, b) => (Math.abs(b.x) + Math.abs(b.y)) - (Math.abs(a.x) + Math.abs(a.y)));
                    
                    if (removable.length > 0) {
                        let toRemove = removable[0];
                        positions = positions.filter(p => !(p.y === toRemove.y && p.z === toRemove.z && (p.x === toRemove.x || p.x === -toRemove.x)));
                    } else {
                        break;
                    }
                } else {
                    let added = false;
                    for (let z = 0; z < maxLayers; z++) {
                        let validSpots = [];
                        if (z === 0) {
                            positions.filter(p => p.z === 0 && p.x >= 0).forEach(p => {
                                [[1, 0], [0, 1], [-1, 0], [0, -1]].forEach(([dx, dy]) => {
                                    let nx = p.x + dx, ny = p.y + dy;
                                    if (nx >= 0 && Math.abs(nx) <= 4.5 && Math.abs(ny) <= 4.5 && !hasPos(positions, nx, ny, 0)) {
                                        validSpots.push({ x: nx, y: ny, z: 0 });
                                    }
                                });
                            });
                        } else {
                            positions.filter(p => p.z === z - 1 && p.x >= 0).forEach(p => {
                                if (!hasPos(positions, p.x, p.y, z)) {
                                    validSpots.push({ x: p.x, y: p.y, z });
                                }
                            });
                        }

                        if (validSpots.length > 0) {
                            let pick = validSpots[Math.floor(Math.random() * validSpots.length)];
                            addSymmetric(pick.x, pick.y, pick.z);
                            added = true;
                            break;
                        }
                    }
                    if (!added) break;
                }
            }

            return positions;
        }

        function calculateAutoFit(positions) {
            const BOARD_W = 920;
            const BOARD_H = 660;
            const PADDING = 30;

            const rawCoords = positions.map(p => {
                const zShift = p.z * 6;
                return {
                    left: (p.x * TILE_WIDTH) - zShift,
                    top: (p.y * TILE_HEIGHT) - zShift
                };
            });

            const minX = Math.min(...rawCoords.map(c => c.left));
            const maxX = Math.max(...rawCoords.map(c => c.left + TILE_WIDTH));
            const minY = Math.min(...rawCoords.map(c => c.top));
            const maxY = Math.max(...rawCoords.map(c => c.top + TILE_HEIGHT));

            const layoutW = maxX - minX;
            const layoutH = maxY - minY;

            const maxAvailW = BOARD_W - (PADDING * 2);
            const maxAvailH = BOARD_H - (PADDING * 2);

            let scale = 1.0;
            if (layoutW > maxAvailW || layoutH > maxAvailH) {
                scale = Math.min(maxAvailW / layoutW, maxAvailH / layoutH);
            }
            scale = Math.max(0.65, Math.min(1.0, scale));

            const layoutCenterX = (minX + maxX) / 2;
            const layoutCenterY = (minY + maxY) / 2;
            const shiftX = (BOARD_W / 2) - layoutCenterX;
            const shiftY = (BOARD_H / 2) - layoutCenterY;

            return { scale, shiftX, shiftY };
        }

        function generateLevel() {
            idCounter = 0;
            let targetCount = parseInt(tileCountInput.value) || 64;
            if (targetCount % 2 !== 0) {
                targetCount++;
                tileCountInput.value = targetCount;
            }

            const maxLayers = parseInt(layersSelect.value) || 3;
            const archetype = archetypeSelect.value;
            const suitsCount = parseInt(difficultySelect.value);

            let positions = generateProceduralLayout(targetCount, maxLayers, archetype);
            targetCount = positions.length;
            tileCountInput.value = targetCount;

            const fit = calculateAutoFit(positions);
            currentScale = fit.scale;
            currentShiftX = fit.shiftX;
            currentShiftY = fit.shiftY;

            tilesContainer.style.transform = `scale(${currentScale})`;

            let tilePool = generateTilePool(targetCount, suitsCount);

            const getExposure = (x, y, z) => (z * 100) + Math.abs(x) + Math.abs(y);
            positions.forEach(p => p.exp = getExposure(p.x, p.y, p.z));

            positions.sort((a, b) => b.exp - a.exp);
            tilePool.sort((a, b) => a.value - b.value);

            positions.forEach((pos, index) => {
                const data = tilePool[index];
                const tile = new Tile(idCounter++, pos.x, pos.y, pos.z, data.value, data.suit);
                tiles.push(tile);
                tilesContainer.appendChild(tile.element);
            });

            updateBoardVisuals();
            
            if (!hasAvailableMoves()) {
                shuffleBoard(); 
            }
        }

        function startGame() {
            tilesContainer.innerHTML = '';
            victoryScreen.style.display = 'none';
            defeatScreen.style.display = 'none';
            tiles = [];
            history = [];
            generateLevel(); 
        }

        themeSelect.addEventListener('change', () => {
            tiles.forEach(tile => tile.applyTheme());
        });

        startBtn.addEventListener('click', startGame);
        undoBtn.addEventListener('click', undoMove);
        restartWinBtn.addEventListener('click', startGame);
        restartLoseBtn.addEventListener('click', startGame);

        startGame();
    </script>

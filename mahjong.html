<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merge Mahjong - Анимации и Цвета</title>
    <style>
        :root {
            --tile-width: 60px;
            --tile-height: 80px;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2b5c4f; 
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
            overflow: hidden; 
        }

        .header { display: flex; gap: 20px; margin-bottom: 20px; }

        button {
            padding: 10px 20px; font-size: 16px; font-weight: bold;
            cursor: pointer; border: none; border-radius: 8px;
            background-color: #f1c40f; color: #333;
            box-shadow: 0 4px 0 #d4ac0d;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        button:active { transform: translateY(4px); box-shadow: 0 0 0 #d4ac0d; }

        #game-board {
            position: relative; width: 800px; height: 600px;
            background-color: rgba(0, 0, 0, 0.2); border-radius: 10px;
            margin-bottom: 20px;
        }

        .tile {
            position: absolute;
            width: var(--tile-width); height: var(--tile-height);
            border: 1px solid rgba(255,255,255,0.2); border-radius: 8px;
            display: flex; justify-content: center; align-items: center;
            font-size: 28px; font-weight: bold; color: white;
            cursor: grab; user-select: none;
            touch-action: none; 
            
            /* Убрали переменную, базовая яркость для всех одинаковая */
            filter: brightness(1);
            
            box-shadow: 
                2px 2px 0px rgba(255,255,255,0.3),
                4px 4px 0px rgba(0,0,0,0.2),
                6px 6px 10px rgba(0,0,0,0.5);
            transition: filter 0.3s, border 0.2s, transform 0.2s;
        }

        /* Заблокированные фишки делаем серыми и темными */
        .tile.blocked {
            filter: brightness(0.4) grayscale(0.5);
            cursor: not-allowed;
        }

        .tile.dragging {
            cursor: grabbing;
            z-index: 99999 !important; 
            filter: brightness(1.2); /* Слегка подсвечиваем ту, что в руке */
            transform: scale(1.15) translateY(-5px);
            border: 3px solid #fff;
            box-shadow: 
                4px 4px 0px rgba(255,255,255,0.4),
                10px 10px 25px rgba(0, 0, 0, 0.7);
        }

        .tile.snap-back {
            transition: left 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), 
                        top 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), 
                        transform 0.3s !important;
        }

        /* --- НОВЫЕ АНИМАЦИИ СЛИЯНИЯ --- */
        @keyframes popIn {
            0% { transform: scale(0.3); opacity: 0; }
            60% { transform: scale(1.15); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes burnOut {
            0% { transform: scale(1); opacity: 1; filter: brightness(1.2); }
            100% { transform: scale(1.4); opacity: 0; filter: brightness(2); }
        }

        /* Класс для появляющейся новой фишки */
        .tile.pop-in {
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* Класс для сгорающих старых фишек */
        .tile.burn {
            pointer-events: none !important; /* Блокируем клики во время анимации */
            z-index: 99999 !important; /* Чтобы вспышка была поверх стола */
            animation: burnOut 0.3s ease-out forwards;
        }
        /* --------------------------------- */

        .victory-screen {
            display: none; position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; background: rgba(0,0,0,0.8);
            justify-content: center; align-items: center; flex-direction: column;
            z-index: 5000; border-radius: 10px;
        }
        .victory-screen h1 { color: #f1c40f; font-size: 48px; }

        .floating-text {
            position: fixed; pointer-events: none; color: #fff;
            font-size: 22px; font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            z-index: 100000; animation: floatUp 1.2s ease-out forwards;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translate(-50%, 0) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -50px) scale(1.2); }
        }
    </style>
</head>
<body>

    <div class="header">
        <button id="start-btn">Старт</button>
        <button id="undo-btn">Отмена</button>
    </div>

    <div id="game-board">
        <div id="victory-screen" class="victory-screen">
            <h1>ПОБЕДА!</h1>
            <button id="restart-btn">Заново</button>
        </div>
    </div>

    <script>
        const boardElement = document.getElementById('game-board');
        const startBtn = document.getElementById('start-btn');
        const undoBtn = document.getElementById('undo-btn');
        const restartBtn = document.getElementById('restart-btn');
        const victoryScreen = document.getElementById('victory-screen');

        const TILE_WIDTH = 60;
        const TILE_HEIGHT = 80;

        let tiles = []; 
        let history = []; 
        let idCounter = 0; 

        const SUIT_COLORS = {
            blue: '#2980b9',   
            green: '#27ae60',  
            yellow: '#d35400'  
        };

        class Tile {
            constructor(id, x, y, z, value, suit) {
                this.id = id;
                this.x = x;
                this.y = y;
                this.z = z;
                this.value = value;
                this.suit = suit; 
                
                this.element = document.createElement('div');
                this.element.className = 'tile';
                this.element.innerText = this.value;
                this.element.style.backgroundColor = SUIT_COLORS[this.suit];
                
                const normX = this.x + 10; 
                const normY = this.y + 10;
                this.element.style.zIndex = Math.floor((this.z * 1000) + (normY * 100) + normX);
                
                const offsetX = 400 - (TILE_WIDTH / 2);
                const offsetY = 300 - (TILE_HEIGHT / 2);
                const zShift = this.z * 6; 
                
                this.pxLeft = offsetX + (this.x * TILE_WIDTH) - zShift;
                this.pxTop = offsetY + (this.y * TILE_HEIGHT) - zShift;
                
                this.element.style.left = `${this.pxLeft}px`;
                this.element.style.top = `${this.pxTop}px`;

                this.element.tileInstance = this;

                this.isDragging = false;
                this.element.addEventListener('pointerdown', (e) => this.startDrag(e));
                this.element.addEventListener('pointermove', (e) => this.drag(e));
                this.element.addEventListener('pointerup', (e) => this.stopDrag(e));
                this.element.addEventListener('pointercancel', (e) => this.snapBackAndCancel(e));
            }

            startDrag(e) {
                if (!isTileFree(this)) {
                    showFloatingText("Нельзя взять", e.clientX, e.clientY);
                    return;
                }
                
                e.preventDefault();
                this.isDragging = true;
                
                this.element.setPointerCapture(e.pointerId);
                this.element.classList.add('dragging');

                const rect = this.element.getBoundingClientRect();
                this.dragOffsetX = e.clientX - rect.left;
                this.dragOffsetY = e.clientY - rect.top;
            }

            drag(e) {
                if (!this.isDragging) return;

                const boardRect = boardElement.getBoundingClientRect();
                const newLeft = (e.clientX - boardRect.left) - this.dragOffsetX;
                const newTop = (e.clientY - boardRect.top) - this.dragOffsetY;

                this.element.style.left = `${newLeft}px`;
                this.element.style.top = `${newTop}px`;
            }

            stopDrag(e) {
                if (!this.isDragging) return;
                
                this.isDragging = false;
                this.element.releasePointerCapture(e.pointerId);
                this.element.classList.remove('dragging');

                this.element.style.pointerEvents = 'none';
                const elemBelow = document.elementFromPoint(e.clientX, e.clientY);
                this.element.style.pointerEvents = 'auto'; 

                let targetTile = null;
                if (elemBelow && elemBelow.classList.contains('tile')) {
                    targetTile = elemBelow.tileInstance;
                }

                if (targetTile && targetTile !== this && isTileFree(targetTile)) {
                    if (targetTile.value === this.value && targetTile.suit === this.suit) {
                        mergeTiles(this, targetTile, e);
                        return; 
                    } else {
                        showFloatingText("Не подходит", e.clientX, e.clientY, "#fff");
                    }
                }

                this.snapBack();
            }

            snapBackAndCancel(e) {
                if (!this.isDragging) return;
                this.isDragging = false;
                this.element.releasePointerCapture(e.pointerId);
                this.element.classList.remove('dragging');
                this.snapBack();
            }

            snapBack() {
                this.element.classList.add('snap-back');
                this.element.style.left = `${this.pxLeft}px`;
                this.element.style.top = `${this.pxTop}px`;
                
                setTimeout(() => {
                    this.element.classList.remove('snap-back');
                }, 300);
            }
        }

        function showFloatingText(message, x, y, color = "#e74c3c") {
            const textEl = document.createElement('div');
            textEl.className = 'floating-text';
            textEl.innerText = message;
            textEl.style.left = `${x}px`;
            textEl.style.top = `${y}px`;
            textEl.style.color = color;
            document.body.appendChild(textEl);
            setTimeout(() => textEl.remove(), 1200);
        }

        function isTileFree(targetTile) {
            const isCovered = tiles.some(t => t.z === targetTile.z + 1 && t.x === targetTile.x && t.y === targetTile.y);
            if (isCovered) return false;

            const hasLeftNeighbor = tiles.some(t => t.z === targetTile.z && t.y === targetTile.y && t.x === targetTile.x - 1);
            const hasRightNeighbor = tiles.some(t => t.z === targetTile.z && t.y === targetTile.y && t.x === targetTile.x + 1);

            return !(hasLeftNeighbor && hasRightNeighbor);
        }

        function updateBoardVisuals() {
            tiles.forEach(tile => {
                if (isTileFree(tile)) {
                    tile.element.classList.remove('blocked');
                } else {
                    tile.element.classList.add('blocked');
                }
            });
        }

        function saveState() {
            const state = tiles.map(t => ({ id: t.id, x: t.x, y: t.y, z: t.z, value: t.value, suit: t.suit }));
            history.push(state);
        }

        // --- ИЗМЕНЕННАЯ ФУНКЦИЯ MERGE С АНИМАЦИЯМИ ---
        function mergeTiles(draggedTile, targetTile, event) {
            saveState(); 

            // Логически сразу удаляем фишки из массива игры, чтобы они освободили место
            tiles = tiles.filter(t => t.id !== draggedTile.id && t.id !== targetTile.id);
            
            // Визуально привязываем перетаскиваемую фишку прямо поверх целевой
            draggedTile.element.style.left = `${targetTile.pxLeft}px`;
            draggedTile.element.style.top = `${targetTile.pxTop}px`;
            
            // Добавляем класс анимации сгорания
            draggedTile.element.classList.add('burn');
            targetTile.element.classList.add('burn');

            // Удаляем старые DOM элементы после того, как завершится анимация .burn (300мс)
            setTimeout(() => {
                draggedTile.element.remove();
                targetTile.element.remove();
            }, 300);

            if (draggedTile.value === 8) {
                showFloatingText("🔥 Сгорели!", event.clientX, event.clientY, "#f1c40f");
            } else {
                const newValue = draggedTile.value * 2; 
                // Создаем новую фишку на этом же месте
                const newTile = new Tile(idCounter++, targetTile.x, targetTile.y, targetTile.z, newValue, draggedTile.suit);
                
                // Добавляем красивую анимацию появления
                newTile.element.classList.add('pop-in');
                // Убираем класс после анимации, чтобы он не конфликтовал с перетаскиванием
                setTimeout(() => newTile.element.classList.remove('pop-in'), 300);

                tiles.push(newTile);
                boardElement.appendChild(newTile.element);
            }
            
            updateBoardVisuals();
            checkVictory(); 
        }

        function checkVictory() {
            if (tiles.length === 0) {
                victoryScreen.style.display = 'flex';
            }
        }

        function undoMove() {
            if (history.length === 0) return; 
            
            const lastState = history.pop(); 
            
            document.querySelectorAll('.tile').forEach(el => el.remove());
            tiles = [];
            victoryScreen.style.display = 'none'; 

            lastState.forEach(data => {
                const t = new Tile(data.id, data.x, data.y, data.z, data.value, data.suit);
                tiles.push(t);
                boardElement.appendChild(t.element);
            });

            const maxId = Math.max(...lastState.map(t => t.id), -1);
            idCounter = maxId + 1;
            
            updateBoardVisuals();
        }

        function generateLevel() {
            idCounter = 0;
            let positions = [];

            const getExposure = (x, y, z) => (z * 100) + Math.abs(x + 0.5) + Math.abs(y + 0.5);

            for(let x = -4; x <= 3; x++) {
                for(let y = -3; y <= 2; y++) positions.push({x, y, z: 0, exp: getExposure(x, y, 0)});
            }
            for(let x = -2; x <= 1; x++) {
                for(let y = -1; y <= 1; y++) positions.push({x, y, z: 1, exp: getExposure(x, y, 1)});
            }
            for(let x = -1; x <= 0; x++) {
                for(let y = -1; y <= 0; y++) positions.push({x, y, z: 2, exp: getExposure(x, y, 2)});
            }

            let tilePool = [
                ...Array(6).fill({ value: 8, suit: 'blue' }),
                ...Array(6).fill({ value: 8, suit: 'green' }),
                ...Array(4).fill({ value: 8, suit: 'yellow' })
            ];

            while (tilePool.length < 64) {
                let splittable = tilePool.map((t, i) => t.value > 1 ? i : -1).filter(i => i !== -1);
                if (splittable.length === 0) break; 

                let randIdx = splittable[Math.floor(Math.random() * splittable.length)];
                
                let target = tilePool[randIdx];
                tilePool.splice(randIdx, 1);
                tilePool.push({ value: target.value / 2, suit: target.suit });
                tilePool.push({ value: target.value / 2, suit: target.suit });
            }

            positions.sort((a, b) => b.exp - a.exp);
            tilePool.sort((a, b) => a.value - b.value);

            positions.forEach((pos, index) => {
                const data = tilePool[index];
                const tile = new Tile(idCounter++, pos.x, pos.y, pos.z, data.value, data.suit);
                tiles.push(tile);
                boardElement.appendChild(tile.element);
            });

            updateBoardVisuals();
        }

        function startGame() {
            document.querySelectorAll('.tile').forEach(el => el.remove());
            victoryScreen.style.display = 'none';
            tiles = [];
            history = [];

            generateLevel(); 
        }

        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);
        undoBtn.addEventListener('click', undoMove);

        startGame();
    </script>
</body>
</html>
